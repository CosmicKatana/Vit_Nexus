<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />

  <!-- Geometric Grid Accent -->
  <circle cx="256" cy="256" r="160" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="110" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1.5" />

  <!-- Command Center Nexus Glyph (V & N intertwined) -->
  <g filter="url(#glow)">
    <!-- Hexagonal Ring Matrix -->
    <path d="M256 120 L370 186 L370 326 L256 392 L142 326 L142 186 Z" stroke="url(#cyan-glow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="rgba(6, 182, 212, 0.04)" />
    
    <!-- Stylized V and N Vectors -->
    <path d="M192 195 L256 315 L320 195" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M256 160 L256 352" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 6" />
    <circle cx="256" cy="315" r="10" fill="#22d3ee" />
    <circle cx="192" cy="195" r="8" fill="#38bdf8" />
    <circle cx="320" cy="195" r="8" fill="#818cf8" />
    <circle cx="256" cy="160" r="6" fill="#a78bfa" />
  </g>

  <!-- HUD Corner Markers -->
  <path d="M50 80 L50 50 L80 50" stroke="rgba(34, 211, 238, 0.35)" stroke-width="3" stroke-linecap="round" />
  <path d="M462 80 L462 50 L432 50" stroke="rgba(34, 211, 238, 0.35)" stroke-width="3" stroke-linecap="round" />
  <path d="M50 432 L50 462 L80 462" stroke="rgba(34, 211, 238, 0.35)" stroke-width="3" stroke-linecap="round" />
  <path d="M462 432 L462 462 L432 462" stroke="rgba(34, 211, 238, 0.35)" stroke-width="3" stroke-linecap="round" />
</svg>
